    <path id="fold" fill="#DDE9E2" stroke="#315C4F" stroke-width="6" stroke-linejoin="round" d="M60,8 V30 H82 Z" />
    <rect id="redaction-bar" x="29" y="49" width="44" height="17" rx="4" fill="#15201D" />
    <rect id="reveal-slit" x="37" y="56" width="24" height="3" rx="1.5" fill="#65D6A6" />
  </g>
