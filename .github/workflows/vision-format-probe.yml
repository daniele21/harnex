name: Vision formatting probe (no write access)

on:
  push:
    branches: [agent/qwen35-vision-format-probe]

permissions:
  contents: read

jobs:
  kotlin-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare SDK for Gradle configuration
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply repository-owned Kotlin formatter only in ephemeral checkout
        run: |
          ./gradlew --no-configuration-cache spotlessApply

      - name: Publish formatted source in log (read-only GitHub token)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess

          result = subprocess.check_output(["git", "diff", "--name-only", "--", "*.kt"], text=True)
          for name in result.splitlines():
              path = pathlib.Path(name)
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              print(f"FORMATTED_FILE_BEGIN::{name}::{data}::FORMATTED_FILE_END", flush=True)
          PY
