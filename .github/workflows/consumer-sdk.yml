name: Consumer SDK validation

on:
  pull_request:
    paths:
      - '.github/workflows/consumer-sdk.yml'
      - '.github/workflows/publish-consumer-sdk.yml'
      - 'core/contracts/**'
      - 'transports/android-binder-contract/**'
      - 'transports/android-binder-client/**'
      - 'samples/external-consumer-android/**'
      - 'scripts/verify-consumer-sdk-publication.sh'
      - 'scripts/dump-consumer-sdk-abi.sh'
      - 'scripts/verify-consumer-sdk-abi.sh'
      - 'docs/shared-runtime/consumer-android-sdk.md'
      - 'docs/shared-runtime/consumer-sdk-public-abi.txt'
      - 'docs/shared-runtime/consumer-sdk-version.txt'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/consumer-sdk.yml'
      - '.github/workflows/publish-consumer-sdk.yml'
      - 'core/contracts/**'
      - 'transports/android-binder-contract/**'
      - 'transports/android-binder-client/**'
      - 'samples/external-consumer-android/**'
      - 'scripts/verify-consumer-sdk-publication.sh'
      - 'scripts/dump-consumer-sdk-abi.sh'
      - 'scripts/verify-consumer-sdk-abi.sh'
      - 'docs/shared-runtime/consumer-sdk-public-abi.txt'
      - 'docs/shared-runtime/consumer-sdk-version.txt'

permissions:
  contents: read

jobs:
  external-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish and consume SDK externally
        env:
          CONSUMER_SDK_VERSION: 0.1.0-ci.${{ github.run_id }}
        run: bash scripts/verify-consumer-sdk-publication.sh

      - name: Generate public ABI evidence
        env:
          CONSUMER_SDK_VERSION: 0.1.0-ci.${{ github.run_id }}
        run: bash scripts/dump-consumer-sdk-abi.sh

      - name: Verify supported ABI baseline
        run: bash scripts/verify-consumer-sdk-abi.sh

      - name: Upload SDK publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-sdk-publication-${{ github.run_id }}
          path: |
            build/consumer-sdk-repository/build-manifest.txt
            build/consumer-sdk-repository/SHA256SUMS
            build/consumer-sdk-repository/public-abi.txt
          if-no-files-found: warn
          retention-days: 7
